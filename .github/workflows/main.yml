          echo "Installed iOS runtimes (full):       $INSTALLED_FULL"
          echo "Installed iOS runtimes (major.minor): $INSTALLED_MM"
          LATEST_RUNTIME=$(echo "$INSTALLED_FULL" | tail -1)
          if [ -z "$LATEST_RUNTIME" ]; then
            echo "::error::No iOS simulator runtimes installed on this runner."
            exit 1
          fi
          PICK=""
          for X in $(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -rV); do
            PLIST="$X/Contents/Developer/Platforms/iPhoneSimulator.platform/Info.plist"
            SDK=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" 2>/dev/null \
                   | grep -oE '[0-9]+\.[0-9]+' | head -1)
            echo "  $X — iOS SDK $SDK"
            for R in $INSTALLED_MM; do
