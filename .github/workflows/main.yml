# Build · Test · Lint · Format · Release-to-TestFlight
#
# Each concern runs as its own job so its pass/fail signal is
# independent in the GitHub UI:
#
#   lint       — swift-format --lint (style + naming)
#   format     — swift-format --in-place idempotency check
#   build      — `xcodebuild build-for-testing` of the app + test
#                bundles. Uploads the compiled .app, .xctest bundles,
#                and the .xctestrun manifest as a "build-products"
#                artifact for the test jobs to consume.
#   test-unit  — downloads build-products and runs
#                `xcodebuild test-without-building` against the
#                ExpresScanTests bundle.
#   test-ui    — same artifact, runs the ExpresScanUITests bundle.
#   release    — only on push to main; archives, uploads to
#                TestFlight, polls App Store Connect to VALID, sets
#                What's New. Depends on every check above passing.
#
# Splitting build from test means each test job can re-run
# independently after a transient simulator hiccup without
# recompiling the world (~5 min compile vs ~1 min download). Splitting
# unit from UI tests means a flaky UI test doesn't block the unit
# signal.
#
# Required GitHub repository secrets (Settings → Secrets and variables
# → Actions → New repository secret):
#
#   ASC_API_KEY_P8                  — contents of AuthKey_*.p8 (raw text, NOT base64)
#   APPLE_DISTRIBUTION_CERT_P12     — base64 of the Apple Distribution .p12
#   APPLE_DISTRIBUTION_CERT_PASSWORD — password for the .p12
#   APPLE_PROVISIONING_PROFILE      — base64 of the App Store .mobileprovision
#   KEYCHAIN_PASSWORD               — any string; used for the temp keychain

name: Build · Test · Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_DESTINATION: 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            App
            Sources
            Tests
            ExpresScanTests
            ExpresScanUITests
            .swift-format
          sparse-checkout-cone-mode: false
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
      - name: swift-format lint
        run: |
          xcrun swift-format lint --recursive --strict \
            App Sources Tests ExpresScanTests ExpresScanUITests

  format:
    name: Format check
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            App
            Sources
            Tests
            ExpresScanTests
            ExpresScanUITests
            .swift-format
          sparse-checkout-cone-mode: false
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
      - name: swift-format idempotency
        run: |
          xcrun swift-format format --recursive --in-place \
            App Sources Tests ExpresScanTests ExpresScanUITests
          if ! git diff --exit-code; then
            echo "::error::swift-format produced a diff. Run 'xcrun swift-format format -i -r App Sources Tests ExpresScanTests ExpresScanUITests' locally and commit the result."
            exit 1
          fi

  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
      - name: Install xcodegen + xcbeautify
        run: brew install xcodegen xcbeautify
      - name: Generate Xcode project
        run: xcodegen generate
      - name: xcodebuild build-for-testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ExpresScan.xcodeproj \
            -scheme ExpresScan-Debug \
            -destination "$TEST_DESTINATION" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
      - name: Upload build products
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: DerivedData/Build/Products
          retention-days: 1
          # Compiled .app + .xctest bundles are mostly already
          # compressed; minimal compression keeps upload fast.
          compression-level: 1

  test-unit:
    name: Test (unit)
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: Download build products
        uses: actions/download-artifact@v4
        with:
          name: build-products
          path: DerivedData/Build/Products
      - name: Locate xctestrun
        id: xctestrun
        run: |
          XCTESTRUN=$(ls DerivedData/Build/Products/*.xctestrun | head -1)
          echo "Found: $XCTESTRUN"
          echo "path=$XCTESTRUN" >> "$GITHUB_OUTPUT"
      - name: xcodebuild test-without-building (unit)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "${{ steps.xctestrun.outputs.path }}" \
            -destination "$TEST_DESTINATION" \
            -resultBundlePath UnitTestResults.xcresult \
            -only-testing:ExpresScanTests \
            | xcbeautify --renderer github-actions
      - name: Upload unit test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: UnitTestResults.xcresult
          retention-days: 7

  test-ui:
    name: Test (UI)
    needs: build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: Download build products
        uses: actions/download-artifact@v4
        with:
          name: build-products
          path: DerivedData/Build/Products
      - name: Locate xctestrun
        id: xctestrun
        run: |
          XCTESTRUN=$(ls DerivedData/Build/Products/*.xctestrun | head -1)
          echo "Found: $XCTESTRUN"
          echo "path=$XCTESTRUN" >> "$GITHUB_OUTPUT"
      - name: xcodebuild test-without-building (UI)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "${{ steps.xctestrun.outputs.path }}" \
            -destination "$TEST_DESTINATION" \
            -resultBundlePath UITestResults.xcresult \
            -only-testing:ExpresScanUITests \
            | xcbeautify --renderer github-actions
      - name: Upload UI test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          retention-days: 7

  release:
    name: Release to TestFlight
    needs: [lint, format, build, test-unit, test-ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install tooling
        run: |
          brew install xcodegen
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Import Apple Distribution cert into a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$CERT_P12_BASE64" | base64 --decode --output "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '" ')
          rm -f "$CERT_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode \
            --output "$PROFILE_DIR/express-polaris-ios-app-store.mobileprovision"

      - name: Install ASC API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.secrets/expresscharge"
          printf '%s' "$ASC_API_KEY_P8" > "$HOME/.secrets/expresscharge/AuthKey_XXXXXXXXXX.p8"
          chmod 600 "$HOME/.secrets/expresscharge/AuthKey_XXXXXXXXXX.p8"

      - name: Configure git for build-bump commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release to TestFlight
        env:
          DEVELOPER_DIR_OVERRIDE: ${{ env.DEVELOPER_DIR }}
        run: bin/release-testflight.sh --skip-device

      - name: Commit & push build-number bump
        run: |
          if git diff --quiet -- project.yml; then
            echo "No build-number bump to commit."
            exit 0
          fi
          NEXT=$(grep -oE 'CURRENT_PROJECT_VERSION: "[0-9]+"' project.yml | head -1 | grep -oE '[0-9]+')
          git add project.yml
          git commit -m "chore(release): bump build to ${NEXT} [skip ci]"
          git push origin HEAD:main
