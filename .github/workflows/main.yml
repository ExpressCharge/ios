# Build · Test · Lint · Format · Release-to-TestFlight
#
# Each concern runs as its own job so its pass/fail signal is
# independent in the GitHub UI:
#
#   lint       — swift-format --lint (style + naming)
#   format     — swift-format --in-place idempotency check
#   build      — `xcodebuild build-for-testing` of the app + test
#                bundles. Uploads the compiled .app, .xctest bundles,
#                and the .xctestrun manifest as a "build-products"
#                artifact for the test jobs to consume.
#   test-unit  — downloads build-products and runs
#                `xcodebuild test-without-building` against the
#                ExpresScanTests bundle.
#   test-ui    — same artifact, runs the ExpresScanUITests bundle.
#   release    — only on push to main; archives, uploads to
#                TestFlight, polls App Store Connect to VALID, sets
#                What's New. Depends on every check above passing.
#
# Splitting build from test means each test job can re-run
# independently after a transient simulator hiccup without
# recompiling the world (~5 min compile vs ~1 min download). Splitting
# unit from UI tests means a flaky UI test doesn't block the unit
# signal.
#
# Required GitHub repository secrets (Settings → Secrets and variables
# → Actions → New repository secret):
#
#   ASC_API_KEY_P8                  — contents of AuthKey_*.p8 (raw text, NOT base64)
#   APPLE_DISTRIBUTION_CERT_P12     — base64 of the Apple Distribution .p12
#   APPLE_DISTRIBUTION_CERT_PASSWORD — password for the .p12
#   APPLE_PROVISIONING_PROFILE      — base64 of the App Store .mobileprovision
#   KEYCHAIN_PASSWORD               — any string; used for the temp keychain

name: Build · Test · Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            App
            Sources
            Tests
            ExpresScanTests
            ExpresScanUITests
            .swift-format
          sparse-checkout-cone-mode: false
      - name: Select Xcode + iOS runtime, export TEST_DESTINATION
        run: |
          # macos-26 ships several Xcodes (e.g. 26.4, 26.5) but only some
          # iOS simulator runtimes are preinstalled. Each Xcode's
          # iPhoneSimulator SDK pairs with a specific runtime version, so
          # picking "latest Xcode" naively can land on an SDK whose runtime
          # is missing. Walk Xcodes newest-first, pick the first whose SDK
          # matches an installed runtime, then derive TEST_DESTINATION
          # from the highest installed iOS runtime so test jobs always
          # target the freshest device available on the image.
          # simctl reports e.g. "iOS 26.4 (26.4.1 - 23E254a)" — the
          # parenthetical is the actual version we need for -destination.
          INSTALLED_FULL=$(xcrun simctl list runtimes 2>/dev/null \
                            | sed -nE 's/.*iOS [0-9.]+ \(([0-9.]+) -.*/\1/p' \
                            | sort -uV)
          # Major.minor view (e.g. "26.4") to match against an Xcode SDK,
          # which only carries the major.minor string.
          INSTALLED_MM=$(echo "$INSTALLED_FULL" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/' | sort -uV)
          echo "Installed iOS runtimes (full):       $INSTALLED_FULL"
          echo "Installed iOS runtimes (major.minor): $INSTALLED_MM"
          LATEST_RUNTIME=$(echo "$INSTALLED_FULL" | tail -1)
          if [ -z "$LATEST_RUNTIME" ]; then
            echo "::error::No iOS simulator runtimes installed on this runner."
            exit 1
          fi
          PICK=""
          for X in $(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -rV); do
            PLIST="$X/Contents/Developer/Platforms/iPhoneSimulator.platform/Info.plist"
            SDK=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" 2>/dev/null \
                   | grep -oE '[0-9]+\.[0-9]+' | head -1)
            echo "  $X — iOS SDK $SDK"
            for R in $INSTALLED_MM; do
              if [ "$R" = "$SDK" ]; then PICK="$X"; break 2; fi
            done
          done
          if [ -z "$PICK" ]; then
            PICK=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
            echo "No Xcode SDK matched an installed runtime; falling back to $PICK"
          fi
          echo "Selected Xcode: $PICK"
          echo "Latest iOS runtime: $LATEST_RUNTIME"
          sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version
          echo "DEVELOPER_DIR=$PICK/Contents/Developer" >> "$GITHUB_ENV"
          echo "TEST_DESTINATION=platform=iOS Simulator,name=iPhone 17 Pro,OS=${LATEST_RUNTIME}" >> "$GITHUB_ENV"
      - name: swift-format lint
        run: |
          xcrun swift-format lint --recursive --strict \
            App Sources Tests ExpresScanTests ExpresScanUITests

  format:
    name: Format check
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            App
            Sources
            Tests
            ExpresScanTests
            ExpresScanUITests
            .swift-format
          sparse-checkout-cone-mode: false
      - name: Select Xcode + iOS runtime, export TEST_DESTINATION
        run: |
          # macos-26 ships several Xcodes (e.g. 26.4, 26.5) but only some
          # iOS simulator runtimes are preinstalled. Each Xcode's
          # iPhoneSimulator SDK pairs with a specific runtime version, so
          # picking "latest Xcode" naively can land on an SDK whose runtime
          # is missing. Walk Xcodes newest-first, pick the first whose SDK
          # matches an installed runtime, then derive TEST_DESTINATION
          # from the highest installed iOS runtime so test jobs always
          # target the freshest device available on the image.
          # simctl reports e.g. "iOS 26.4 (26.4.1 - 23E254a)" — the
          # parenthetical is the actual version we need for -destination.
          INSTALLED_FULL=$(xcrun simctl list runtimes 2>/dev/null \
                            | sed -nE 's/.*iOS [0-9.]+ \(([0-9.]+) -.*/\1/p' \
                            | sort -uV)
          # Major.minor view (e.g. "26.4") to match against an Xcode SDK,
          # which only carries the major.minor string.
          INSTALLED_MM=$(echo "$INSTALLED_FULL" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/' | sort -uV)
          echo "Installed iOS runtimes (full):       $INSTALLED_FULL"
          echo "Installed iOS runtimes (major.minor): $INSTALLED_MM"
          LATEST_RUNTIME=$(echo "$INSTALLED_FULL" | tail -1)
          if [ -z "$LATEST_RUNTIME" ]; then
            echo "::error::No iOS simulator runtimes installed on this runner."
            exit 1
          fi
          PICK=""
          for X in $(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -rV); do
            PLIST="$X/Contents/Developer/Platforms/iPhoneSimulator.platform/Info.plist"
            SDK=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" 2>/dev/null \
                   | grep -oE '[0-9]+\.[0-9]+' | head -1)
            echo "  $X — iOS SDK $SDK"
            for R in $INSTALLED_MM; do
              if [ "$R" = "$SDK" ]; then PICK="$X"; break 2; fi
            done
          done
          if [ -z "$PICK" ]; then
            PICK=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
            echo "No Xcode SDK matched an installed runtime; falling back to $PICK"
          fi
          echo "Selected Xcode: $PICK"
          echo "Latest iOS runtime: $LATEST_RUNTIME"
          sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version
          echo "DEVELOPER_DIR=$PICK/Contents/Developer" >> "$GITHUB_ENV"
          echo "TEST_DESTINATION=platform=iOS Simulator,name=iPhone 17 Pro,OS=${LATEST_RUNTIME}" >> "$GITHUB_ENV"
      - name: swift-format idempotency
        run: |
          xcrun swift-format format --recursive --in-place \
            App Sources Tests ExpresScanTests ExpresScanUITests
          if ! git diff --exit-code; then
            echo "::error::swift-format produced a diff. Run 'xcrun swift-format format -i -r App Sources Tests ExpresScanTests ExpresScanUITests' locally and commit the result."
            exit 1
          fi

  build:
    name: Build
    # Fail-fast: skip the ~5-min compile when lint or format already
    # flagged a violation. Test/release jobs already chain off `build`,
    # so gating this job effectively short-circuits the whole pipeline.
    needs: [lint, format]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode + iOS runtime, export TEST_DESTINATION
        run: |
          # macos-26 ships several Xcodes (e.g. 26.4, 26.5) but only some
          # iOS simulator runtimes are preinstalled. Each Xcode's
          # iPhoneSimulator SDK pairs with a specific runtime version, so
          # picking "latest Xcode" naively can land on an SDK whose runtime
          # is missing. Walk Xcodes newest-first, pick the first whose SDK
          # matches an installed runtime, then derive TEST_DESTINATION
          # from the highest installed iOS runtime so test jobs always
          # target the freshest device available on the image.
          # simctl reports e.g. "iOS 26.4 (26.4.1 - 23E254a)" — the
          # parenthetical is the actual version we need for -destination.
          INSTALLED_FULL=$(xcrun simctl list runtimes 2>/dev/null \
                            | sed -nE 's/.*iOS [0-9.]+ \(([0-9.]+) -.*/\1/p' \
                            | sort -uV)
          # Major.minor view (e.g. "26.4") to match against an Xcode SDK,
          # which only carries the major.minor string.
          INSTALLED_MM=$(echo "$INSTALLED_FULL" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/' | sort -uV)
          echo "Installed iOS runtimes (full):       $INSTALLED_FULL"
          echo "Installed iOS runtimes (major.minor): $INSTALLED_MM"
          LATEST_RUNTIME=$(echo "$INSTALLED_FULL" | tail -1)
          if [ -z "$LATEST_RUNTIME" ]; then
            echo "::error::No iOS simulator runtimes installed on this runner."
            exit 1
          fi
          PICK=""
          for X in $(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -rV); do
            PLIST="$X/Contents/Developer/Platforms/iPhoneSimulator.platform/Info.plist"
            SDK=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" 2>/dev/null \
                   | grep -oE '[0-9]+\.[0-9]+' | head -1)
            echo "  $X — iOS SDK $SDK"
            for R in $INSTALLED_MM; do
              if [ "$R" = "$SDK" ]; then PICK="$X"; break 2; fi
            done
          done
          if [ -z "$PICK" ]; then
            PICK=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
            echo "No Xcode SDK matched an installed runtime; falling back to $PICK"
          fi
          echo "Selected Xcode: $PICK"
          echo "Latest iOS runtime: $LATEST_RUNTIME"
          sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version
          echo "DEVELOPER_DIR=$PICK/Contents/Developer" >> "$GITHUB_ENV"
          echo "TEST_DESTINATION=platform=iOS Simulator,name=iPhone 17 Pro,OS=${LATEST_RUNTIME}" >> "$GITHUB_ENV"
      - name: Install xcodegen + xcbeautify
        run: brew install xcodegen xcbeautify
      - name: Generate Xcode project
        run: xcodegen generate
      - name: xcodebuild build-for-testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ExpresScan.xcodeproj \
            -scheme ExpresScan-Debug \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
      - name: Upload build products
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: DerivedData/Build/Products
          retention-days: 1
          # Compiled .app + .xctest bundles are mostly already
          # compressed; minimal compression keeps upload fast.
          compression-level: 1

  test-unit:
    name: Test (unit)
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Select Xcode + iOS runtime, export TEST_DESTINATION
        run: |
          # macos-26 ships several Xcodes (e.g. 26.4, 26.5) but only some
          # iOS simulator runtimes are preinstalled. Each Xcode's
          # iPhoneSimulator SDK pairs with a specific runtime version, so
