          xcodebuild test-without-building \
            -xctestrun "${{ steps.xctestrun.outputs.path }}" \
            -destination "$TEST_DESTINATION" \
            -resultBundlePath UITestResults.xcresult \
            -only-testing:ExpresScanUITests \
            | xcbeautify --renderer github-actions
      - name: Upload UI test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          retention-days: 7

  release:
    name: Release to TestFlight
    needs: [lint, format, build, test-unit, test-ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.MIGRATION_DONE == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode + iOS runtime, export TEST_DESTINATION
        run: |
          # macos-26 ships several Xcodes (e.g. 26.4, 26.5) but only some
          # iOS simulator runtimes are preinstalled. Each Xcode's
          # iPhoneSimulator SDK pairs with a specific runtime version, so
          # picking "latest Xcode" naively can land on an SDK whose runtime
          # is missing. Walk Xcodes newest-first, pick the first whose SDK
          # matches an installed runtime, then derive TEST_DESTINATION
          # from the highest installed iOS runtime so test jobs always
          # target the freshest device available on the image.
          # simctl reports e.g. "iOS 26.4 (26.4.1 - 23E254a)" — the
          # parenthetical is the actual version we need for -destination.
          INSTALLED_FULL=$(xcrun simctl list runtimes 2>/dev/null \
                            | sed -nE 's/.*iOS [0-9.]+ \(([0-9.]+) -.*/\1/p' \
                            | sort -uV)
          # Major.minor view (e.g. "26.4") to match against an Xcode SDK,
          # which only carries the major.minor string.
          INSTALLED_MM=$(echo "$INSTALLED_FULL" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/' | sort -uV)
          echo "Installed iOS runtimes (full):       $INSTALLED_FULL"
          echo "Installed iOS runtimes (major.minor): $INSTALLED_MM"
          LATEST_RUNTIME=$(echo "$INSTALLED_FULL" | tail -1)
          if [ -z "$LATEST_RUNTIME" ]; then
            echo "::error::No iOS simulator runtimes installed on this runner."
            exit 1
          fi
          PICK=""
          for X in $(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -rV); do
            PLIST="$X/Contents/Developer/Platforms/iPhoneSimulator.platform/Info.plist"
            SDK=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" 2>/dev/null \
                   | grep -oE '[0-9]+\.[0-9]+' | head -1)
            echo "  $X — iOS SDK $SDK"
            for R in $INSTALLED_MM; do
              if [ "$R" = "$SDK" ]; then PICK="$X"; break 2; fi
            done
          done
          if [ -z "$PICK" ]; then
            PICK=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
            echo "No Xcode SDK matched an installed runtime; falling back to $PICK"
          fi
          echo "Selected Xcode: $PICK"
          echo "Latest iOS runtime: $LATEST_RUNTIME"
          sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version
          echo "DEVELOPER_DIR=$PICK/Contents/Developer" >> "$GITHUB_ENV"
          echo "TEST_DESTINATION=platform=iOS Simulator,name=iPhone 17 Pro,OS=${LATEST_RUNTIME}" >> "$GITHUB_ENV"

      - name: Install tooling
        run: |
          brew install xcodegen
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Import Apple Distribution cert into a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$CERT_P12_BASE64" | base64 --decode --output "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '" ')
          rm -f "$CERT_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode \
            --output "$PROFILE_DIR/expresscharge-ios-app-store.mobileprovision"

      - name: Install ASC API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.secrets/expresscharge"
          KEY_PATH="$HOME/.secrets/expresscharge/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Configure git for build-bump commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release to TestFlight
        env:
          DEVELOPER_DIR_OVERRIDE: ${{ env.DEVELOPER_DIR }}
        run: bin/release-testflight.sh --skip-device

      - name: Commit & push build-number bump
        run: |
          if git diff --quiet -- project.yml; then
            echo "No build-number bump to commit."
            exit 0
          fi
          NEXT=$(grep -oE 'CURRENT_PROJECT_VERSION: "[0-9]+"' project.yml | head -1 | grep -oE '[0-9]+')
          git add project.yml
          git commit -m "chore(release): bump build to ${NEXT} [skip ci]"
          git push origin HEAD:main
