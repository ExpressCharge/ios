# project.yml — XcodeGen specification for the ExpresScan iOS app target.
#
# This file is the single source of truth for the SwiftUI app target. The
# Swift package targets (Models / Crypto / Networking / AuthCore) are
# declared in `Package.swift` and consumed here via the `package:` block
# below. Re-generate the `.xcodeproj` on a developer Mac with:
#
#     xcodegen generate
#
# Spec references:
#   docs/plan/50-ios.md  § "Project setup", "Project structure"
#   docs/plan/60-security.md § 1, 2 (PKCE, Keychain accessibility)
#   docs/plan/40-frontend.md § "Design tokens for iOS team"
#
# Two configurations and two schemes:
#   - Debug   → sandbox APNs, https://dev.api.polaris.express
#   - Release → production APNs, https://api.polaris.express

name: ExpresScan
options:
  bundleIdPrefix: gg.vlad
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

# Default settings inherited by every target & configuration unless
# overridden. The strictness flags here match `50-ios.md`'s requirement for
# Swift 6 with `targeted` strict concurrency (NOT `complete`).
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "48H7CLBV8Y"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1"
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

configs:
  Debug: debug
  Release: release

# The four pure-Swift libraries are produced by Package.swift in this same
# repo, so we declare a local Swift package and depend on its products.
packages:
  ExpresScanCore:
    path: .

targets:
  ExpresScan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
          - "Resources/PrivacyInfo.xcprivacy"
          - "Resources/ExpresScan.entitlements"
    resources:
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/PrivacyInfo.xcprivacy
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: ExpresScan
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: Background
        UIRequiredDeviceCapabilities:
          - arm64
          - nfc
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIBackgroundModes:
          - remote-notification
        NFCReaderUsageDescription: "ExpresScan reads the unique ID from your NFC charge card so the charging station can verify your account and start your session."
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/Resources/ExpresScan.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - TAG
        com.apple.developer.associated-domains:
          - applinks:manage.polaris.express
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.vlad.expresscan
        PRODUCT_NAME: ExpresScan
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/ExpresScan.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: PrimaryCyan
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          # Sandbox APNs + dev backend. The aps-environment is folded into
          # the entitlements file at build time via the per-config block
          # below.
          API_BASE_URL: "https://dev.api.polaris.express"
          GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) API_BASE_URL=@\"https://dev.api.polaris.express\""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APNS_SANDBOX"
          OTHER_SWIFT_FLAGS: "$(inherited) -DAPI_BASE_URL_DEV"
          APS_ENVIRONMENT: development
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          API_BASE_URL: "https://api.polaris.express"
          GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) API_BASE_URL=@\"https://api.polaris.express\""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APNS_PRODUCTION"
          OTHER_SWIFT_FLAGS: "$(inherited) -DAPI_BASE_URL_PROD"
          APS_ENVIRONMENT: production
          PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - package: ExpresScanCore
        product: Models
      - package: ExpresScanCore
        product: Crypto
      - package: ExpresScanCore
        product: Networking
      - package: ExpresScanCore
        product: AuthCore
    preBuildScripts:
      - name: "Stamp aps-environment into entitlements"
        # The entitlements file ships with `aps-environment = development`
        # by default. Release builds rewrite it via PlistBuddy. We do this
        # in a pre-build script (rather than two separate entitlement
        # files) so the file lives in source control once.
        script: |
          set -euo pipefail
          ENT="${PROJECT_DIR}/App/Resources/ExpresScan.entitlements"
          if [ "${CONFIGURATION}" = "Release" ]; then
            /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT" 2>/dev/null || true
          else
            /usr/libexec/PlistBuddy -c "Set :aps-environment development" "$ENT" 2>/dev/null || true
          fi
        basedOnDependencyAnalysis: false

  ExpresScanTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ExpresScanTests
    dependencies:
      - target: ExpresScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.vlad.expresscan.tests
        PRODUCT_NAME: ExpresScanTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ExpresScan.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ExpresScan"

schemes:
  ExpresScan-Debug:
    build:
      targets:
        ExpresScan: all
        ExpresScanTests: [test]
    run:
      config: Debug
      askForAppToLaunch: false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ExpresScanTests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug
  ExpresScan-Release:
    build:
      targets:
        ExpresScan: all
    run:
      config: Release
    test:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
